<text x="82" y="24" fill="#8b949e">zap</text>
<text x="22" y="58" fill="#7ee787" xml:space="preserve">$ zap --help</text>
<text x="22" y="98" fill="#c9d1d9" xml:space="preserve">A fast way to search and remove folders</text>
<text x="22" y="138" fill="#79c0ff" xml:space="preserve">Usage:</text>
<text x="22" y="158" fill="#c9d1d9" xml:space="preserve">  zap [folder-name] [flags]</text>
<text x="22" y="198" fill="#79c0ff" xml:space="preserve">Flags:</text>
<text x="22" y="218" fill="#8b949e" xml:space="preserve">  -h, --help     help for zap</text>
<text x="22" y="238" fill="#8b949e" xml:space="preserve">  -s, --search   Enable search mode with glob patterns</text>
